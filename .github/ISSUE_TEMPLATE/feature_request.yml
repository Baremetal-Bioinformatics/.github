name: Feature proposal
description: Propose a scoped capability or experiment
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user
      description: What problem should be solved, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change and its interfaces.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Correctness or output contract
      description: What must remain identical, statistically equivalent, or explicitly changed?
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Acceptance evidence
      description: Tests, benchmark comparator, dataset, or decision threshold that would accept or reject this proposal.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
